[project]
name = "belting-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7.0",
    "claude-agent-sdk>=0.2.178",
    "django>=6.1.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pypdf>=7.0.1",
    "pytelegrambotapi>=4.37.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-types>=0.24.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-django>=4.14.0",
    "pytest-testmon>=2.3.0",
    "ruff>=0.17.5",
    "ty>=0.0.102",
]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "**/migrations/*.py"]

[tool.ruff.lint]
# asosiy xatolar + importlar + zamonaviy sintaksis + ehtimoliy buglar + Django qoidalari
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PERF", "S", "DJ"]
ignore = [
    "E501",                        # uzun qator — formatter hal qiladi
    "S101",                        # testlarda assert
    "RUF001", "RUF002", "RUF003",  # o'zbek harflari (ʻ, —) ataylab
    "RUF012",                      # Django Meta/class atributlari
    "E731", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B011"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- ty (tiplar)
[tool.ty.src]
exclude = ["data", "**/migrations"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
